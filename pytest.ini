[pytest]
asyncio_mode = auto
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning:audioop
# `-m "not slow"`: the default run EXCLUDES tests that spawn real
#   subprocesses (node helper, `bash run-bot.sh`, process-group signals).
#   Running every test at once piles up real processes + asyncio loops and
#   has SIGKILLed (exit 137) the whole sandbox. Plain `pytest` is now safe.
#   Run the heavy ones deliberately and one file at a time:
#       pytest -m slow tests/test_lock_restore_flow.py
# `--timeout=60`: a hung test fails instead of wedging the session
#   (requires pytest-timeout, see requirements-dev.txt).
addopts = -ra --strict-markers -m "not slow" --timeout=60
markers =
    slow: spawns real OS processes; excluded by default, run one file at a time
